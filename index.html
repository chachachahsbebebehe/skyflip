<!DOCTYPE html>
<html lang="en">
<head>

<title>Skyflip</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0d1b3a;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif;color:#fff}
canvas#c{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
#hud{position:fixed;top:10px;right:10px;display:flex;gap:8px;z-index:5}
.ib{width:52px;height:52px;border-radius:14px;border:2px solid rgba(255,255,255,.35);background:rgba(10,20,45,.55);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px);padding:0}
.ib:active{transform:scale(.93)}
.ib svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;touch-action:pan-y}
#title{background:radial-gradient(ellipse at 50% 30%,rgba(20,40,90,.35),rgba(5,10,30,.82))}
.panel{width:min(760px,100%);background:linear-gradient(160deg,rgba(25,40,85,.88),rgba(12,18,45,.92));border:2px solid rgba(255,255,255,.14);border-radius:24px;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;max-height:100%;overflow:auto}
.logo{font-size:clamp(46px,10vw,92px);font-weight:900;letter-spacing:2px;line-height:1;margin:4px 0 2px;font-style:italic;background:linear-gradient(180deg,#fff 0%,#ffe27a 45%,#ff8a3d 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 rgba(0,0,0,.35))}
.tag{opacity:.85;font-size:clamp(14px,2.4vw,18px);margin-bottom:14px}
.btn{font:inherit;font-weight:800;font-size:20px;border:none;border-radius:16px;padding:14px 28px;margin:6px;cursor:pointer;color:#1b1300;background:linear-gradient(180deg,#ffe27a,#ffb02e);box-shadow:0 5px 0 #b86d00,0 8px 18px rgba(0,0,0,.35);min-height:54px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b86d00}
.btn.big{font-size:28px;padding:16px 56px}
.btn.alt{background:linear-gradient(180deg,#9fd8ff,#4ea6ff);color:#04172e;box-shadow:0 5px 0 #1f5fa8,0 8px 18px rgba(0,0,0,.35)}
.btn.ghost{background:rgba(255,255,255,.12);color:#fff;box-shadow:none;border:2px solid rgba(255,255,255,.3)}
.btn:disabled{opacity:.4;cursor:default}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:10px 0 12px;max-height:min(40vh,330px);overflow-y:auto;padding:4px 6px 4px 2px;touch-action:pan-y;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent;border-radius:12px;background:rgba(0,0,0,.15)}
.levels::-webkit-scrollbar{width:8px}.levels::-webkit-scrollbar-thumb{background:rgba(255,255,255,.3);border-radius:8px}
.world{grid-column:1/-1;text-align:left;font-weight:900;font-size:12px;letter-spacing:1.5px;color:#ffd23f;margin:6px 4px 0}
.lv{font:inherit;color:#fff;text-align:left;border-radius:12px;padding:8px 10px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);cursor:pointer;min-height:58px}
.lv b{display:block;font-size:14px;line-height:1.2}
.lv small{display:block;opacity:.75;font-size:11.5px;margin-top:3px}

@media (max-height:600px){.levels{max-height:34vh}.logo{font-size:44px}.tag{margin-bottom:6px}}
.lv.sel{border-color:#ffd23f;background:rgba(255,210,63,.16)}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;font-size:14px;opacity:.9;margin-top:8px}
.legend span{white-space:nowrap}
kbd{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-bottom-width:3px;border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:700;font-size:13px}
#result{align-items:flex-end;padding-bottom:4vh;pointer-events:none}
#result .panel{pointer-events:auto;width:min(520px,100%)}
@media (min-width:900px){#result{align-items:center;justify-content:flex-end;padding:16px 4vw}}
@media (max-height:560px){#rList li{padding:2px 8px;font-size:14px}.btn{padding:10px 18px;min-height:46px}}
#rTitle{font-size:clamp(34px,7vw,56px);font-weight:900;font-style:italic;line-height:1.05}
#rSub{opacity:.8;margin:4px 0 8px}

#rScore{font-size:30px;font-weight:900;margin:6px 0 0}
#rBest{opacity:.8;font-size:14px;margin-bottom:6px}
#rUnlock{color:#7dff9a;font-weight:800;margin:4px 0}
.hint{opacity:.65;font-size:13px;margin-top:6px}
#pause{background:rgba(5,10,30,.6)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>

const ease=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const wrapA=a=>{a=(a+Math.PI)%TAU;if(a<0)a+=TAU;return a-Math.PI;};
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n);}

// ================= Save data =================
const SKEY='skyflip.save.v1';
const save={best:{},unlocked:1,muted:false,last:0,flips:0};
try{const s=JSON.parse(localStorage.getItem(SKEY)||'{}');if(s&&typeof s==='object')Object.assign(save,s);}catch(e){}

// ================= Levels =================
// World units are meters, y points up, y=0 is the ground/water line.
// Builds a chain of trampolines whose spacing matches their bounce arc (plus wind), ending in a landing mat.
function trampChain(c0,n,o){
  const g=o.g||9.8, wd=o.wind||0, w=o.w||5, items=[];let c=c0;
  for(let i=0;i<n;i++){
    items.push({type:'tramp',x1:c-w/2,x2:c+w/2,top:0.8,thin:0.12,bvx:o.bvx,bvy:o.bvy,move:o.move?{amp:o.move.amp,period:o.move.period,phase:i*1.7}:null});
    const t=2*o.bvy/g;c+=o.bvx*t+0.5*wd*t*t;
  }
  const mw=o.mw||7, tw=o.tw||3.5;
  items.push({type:'mat',x1:c-mw/2,x2:c+mw/2,top:0.4,target:[c-tw/2,c+tw/2],shrink:o.shrink||null,blink:o.blink||null});
  return items;
}
function towerStart(top){return [{type:'tower',x1:-5,x2:-1.4,top},{type:'board',x1:-1.4,x2:0.2,top,thin:0.16,start:true}];}
const WORLDS=['Rookie','Pro','Expert','Master','Legend'];
const LEVELS=[
 // ---------- World 1: Rookie ----------

];
LEVELS.forEach((l,i)=>{l.world=Math.floor(i/6);});
let LI=0, level=LEVELS[0];

// ================= Physics constants =================
let G=-9.8;const STEP=1/120;
const I_EXT=1.0, I_TUCK=0.3, SPIN_ACCEL=7.2, L_MAX=4.7, OPEN_DAMP=4.5;
const PIV={x:0.02,y:0.1};

// ================= Poses =================
const PK=['sp','hN','kN','hF','kF','sN','eN','sF','eF'];
function pose(a){const o={};PK.forEach((k,i)=>o[k]=a[i]);return o;}
const STAND =pose([0,0.05,0.08,-0.05,0.05,0.15,0.25,-0.1,0.2]);
const CROUCH=pose([-0.45,1.2,1.9,1.1,1.8,-0.75,0.3,-0.85,0.3]);
const OPEN  =pose([0.06,-0.05,0.05,0.08,0.15,2.9,0.1,2.7,0.2]);
const TUCK  =pose([-0.5,2.5,2.05,2.4,2.0,1.1,0.3,1.0,0.4]);
const LAND  =pose([-0.35,1.0,1.5,0.95,1.45,1.3,0.3,1.2,0.4]);
const CELEB =pose([0.08,0.05,0.05,-0.05,0.05,2.6,0.2,2.45,0.25]);
const DIVE  =pose([0,0,0.02,0.04,0.06,3.1,0,3.05,0.05]);
function lerpPose(a,b,t,o){o=o||{};for(const k of PK)o[k]=a[k]+(b[k]-a[k])*t;return o;}
function copyPose(a){return lerpPose(a,a,0);}

// ================= Skeleton =================
const RJ=['head','chest','pelvis','kneeN','footN','kneeF','footF','elbN','handN','elbF','handF'];
function newJ(){const o={};RJ.forEach(k=>o[k]={x:0,y:0});return o;}
const LOC=newJ();
let J=newJ(), PJ=newJ();
function fk(p){
  const s=p.sp, ux=-Math.sin(s), uy=Math.cos(s);
  LOC.pelvis.x=0;LOC.pelvis.y=0;
  LOC.chest.x=ux*0.52;LOC.chest.y=uy*0.52;
  LOC.head.x=ux*0.8;LOC.head.y=uy*0.8;
  limb(p.hN+s,-p.kN,'kneeN','footN',0.46,0.46,LOC.pelvis);
  limb(p.hF+s,-p.kF,'kneeF','footF',0.46,0.46,LOC.pelvis);
  limb(p.sN+s,p.eN,'elbN','handN',0.3,0.28,LOC.chest);
  limb(p.sF+s,p.eF,'elbF','handF',0.3,0.28,LOC.chest);
}
function limb(a,b2,m,e,l1,l2,root){
  LOC[m].x=root.x+Math.sin(a)*l1;LOC[m].y=root.y-Math.cos(a)*l1;
  const b=a+b2;LOC[e].x=LOC[m].x+Math.sin(b)*l2;LOC[e].y=LOC[m].y-Math.cos(b)*l2;
}
function placeJ(){
  const c=Math.cos(P.th), s=Math.sin(P.th);
  for(const k of RJ){const lx=LOC[k].x-PIV.x, ly=LOC[k].y-PIV.y;J[k].x=P.x+c*lx-s*ly;J[k].y=P.y+s*lx+c*ly;}
}
function swapJ(){for(const k of RJ){PJ[k].x=J[k].x;PJ[k].y=J[k].y;}}
function groundJ(top){ // shift so lowest foot sits on surface
  const m=Math.min(J.footN.y,J.footF.y), dy=top+0.05-m;
  P.y+=dy;for(const k of RJ)J[k].y+=dy;
}

// ================= Player / attempt state =================
const P={x:0,y:0,vx:0,vy:0,th:0,L:0,w:0,tuck:0,rot:0,state:'ready',airT:0,stateT:0,meter:0,meterT:0,
  ground:null,lastFlip:0,landPose:null,q:'',stumbleA:0,pose:copyPose(STAND),zones:new Array(50).fill(0),doneT:0};
const A={score:0,combo:0,log:[],final:'',finalName:''};
let streak=0, gameT=0, mode='title', resultShown=false, readyAt=0;
const input={back:false,front:false,pointers:0};
let trail=[], trailTick=0;

function startItem(){return level.items.find(i=>i.start);}
function itOff(it,t){return it.move?it.move.amp*Math.sin(TAU*(t===undefined?gameT:t)/it.move.period+(it.move.phase||0)):0;}
function blinkOn(it,t){if(!it.blink)return true;const c=it.blink.on+it.blink.off;return ((t%c)+c)%c<it.blink.on;}
// Target zone of an item at time t: [a,b,isOff] or null
function tRange(it,t){
  if(t===undefined)t=gameT;let a,b;const o=itOff(it,t);
  if(it.target==='all'){a=it.x1+o;b=it.x2+o;}else if(Array.isArray(it.target)){a=it.target[0]+o;b=it.target[1]+o;}else return null;
  if(it.shrink){const s=it.shrink.min+(1-it.shrink.min)*(0.5+0.5*Math.cos(TAU*t/it.shrink.period));const m=(a+b)/2,h=(b-a)/2*s;a=m-h;b=m+h;}
  return [a,b,!blinkOn(it,t)];
}
function itX1(it,t){return it.x1+itOff(it,t);}
function itX2(it,t){return it.x2+itOff(it,t);}
function isSolid(it){return it.type!=='water'&&!it.thin;}
function waterAt(x){
  for(const it of level.items) if(it.type==='water'&&x>=it.x1&&x<=it.x2) return it;
  return level.floor==='water'?true:null;
}

function loadLevel(i){
  LI=clamp(i,0,LEVELS.length-1);level=LEVELS[LI];save.last=LI;persist();G=-(level.grav||9.8);
  for(const it of level.items){it.dip=0;it.dipX=(it.x1+it.x2)/2;
    if(it.type==='cliff'&&!it.jag){const r=[];for(let k=0;k<=40;k++)r.push(hash(k*3.7+it.top)*0.5);it.jag=r;}}
  setTheme(level.theme);
  resetAttempt();
}
function resetAttempt(){
  const s=startItem();
  P.x=s.x2-0.35;P.y=s.top+1;P.vx=P.vy=0;P.th=0;P.L=0;P.w=0;P.tuck=0;P.rot=0;P.airT=0;P.stateT=0;
  P.state='ready';P.meterT=0;P.meter=0;P.ground=s;P.doneT=0;P.lastFlip=0;
  A.score=0;A.combo=0;A.log.length=0;A.final='';A.finalName='';
  trail.length=0;rag=null;resultShown=false;readyAt=performance.now();
  input.back=input.front=false;
  for(const it of level.items){it.dip=0;}
  lerpPose(STAND,STAND,0,P.pose);fk(P.pose);placeJ();groundJ(s.top);swapJ();
  cam.x=P.x+3;cam.y=P.y;camSnap=true;
  hideEl('result');
}

// ================= Audio (procedural Web Audio) =================
const Snd={ac:null,out:null,nb:null,wg:null,wf:null,muted:!!save.muted,
  init(){
    try{
      if(!this.ac){
        const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
        this.ac=new AC();this.out=this.ac.createGain();this.out.gain.value=this.muted?0:0.8;
        const comp=this.ac.createDynamicsCompressor();this.out.connect(comp);comp.connect(this.ac.destination);
        const len=this.ac.sampleRate*2, b=this.ac.createBuffer(1,len,this.ac.sampleRate), d=b.getChannelData(0);
        for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nb=b;
        const src=this.ac.createBufferSource();src.buffer=b;src.loop=true;
        this.wf=this.ac.createBiquadFilter();this.wf.type='bandpass';this.wf.frequency.value=500;this.wf.Q.value=0.8;
        this.wg=this.ac.createGain();this.wg.gain.value=0;src.connect(this.wf);this.wf.connect(this.wg);this.wg.connect(this.out);src.start();
      }
      if(this.ac.state==='suspended')this.ac.resume();
    }catch(e){this.ac=null;}
  },
  setMuted(m){this.muted=m;save.muted=m;persist();if(this.out)this.out.gain.setTargetAtTime(m?0:0.8,this.ac.currentTime,0.02);},
  wind(v,f){if(!this.wg)return;const t=this.ac.currentTime;this.wg.gain.setTargetAtTime(v,t,0.06);this.wf.frequency.setTargetAtTime(f,t,0.08);},
  ok(){return this.ac&&!this.muted&&this.ac.state==='running';},
  tone(f,dur,type,vol,f2,delay){
    if(!this.ok())return;const t=this.ac.currentTime+(delay||0);
    const o=this.ac.createOscillator(),g=this.ac.createGain();o.type=type||'sine';
    o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(this.out);o.start(t);o.stop(t+dur+0.05);
  },
  noise(dur,vol,ft,freq,q,delay,att){
    if(!this.ok())return;const t=this.ac.currentTime+(delay||0);
    const s=this.ac.createBufferSource();s.buffer=this.nb;const f=this.ac.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=q||1;
    const g=this.ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(att||0.008));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(this.out);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);
  },
  jump(){this.tone(200,0.2,'triangle',0.22,520);this.noise(0.18,0.12,'highpass',1800);},
  tick(n){this.tone(520+Math.min(n,6)*130,0.1,'square',0.07);this.tone(1040+Math.min(n,6)*260,0.08,'sine',0.05,null,0.04);},
  boing(){this.tone(130,0.38,'sine',0.45,430);this.tone(260,0.28,'triangle',0.12,760);},
  thud(v){v=v||1;this.tone(120,0.22,'sine',Math.min(0.6,0.45*v),38);this.noise(0.14,Math.min(0.35,0.22*v),'lowpass',520);},
  land(){this.thud(0.8);this.noise(0.12,0.14,'bandpass',1400,1);},
  splash(big){this.noise(big?1.0:0.55,big?0.5:0.28,'lowpass',big?1600:3200,0.7);this.noise(0.4,0.18,'highpass',2600,0.7,0.03);},
  cheer(perfect){this.noise(1.5,perfect?0.2:0.13,'bandpass',1500,0.6,0,0.25);const n=perfect?[523,659,784,1046]:[523,659,784];n.forEach((f,i)=>this.tone(f,0.28,'triangle',0.15,null,i*0.08));},
  crash(){this.thud(1.2);this.tone(330,0.32,'sawtooth',0.07,90);this.tone(200,0.2,'square',0.05,60,0.12);},
  click(){this.tone(760,0.05,'square',0.05);}
};

// ================= Particles & popups =================
const parts=[];let PMAX=260;
function addP(o){if(parts.length>=PMAX)parts.shift();parts.push(o);}
function dust(x,y,n,col){for(let i=0;i<n;i++)addP({k:'d',x:x+(Math.random()-0.5)*0.5,y:y+0.05,vx:(Math.random()-0.5)*3,vy:Math.random()*1.6,life:0,max:0.5+Math.random()*0.5,s:0.12+Math.random()*0.15,c:col});}
function splash(x,n,pw){for(let i=0;i<n;i++){const a=Math.PI/2+(Math.random()-0.5)*1.4;const sp=(2+Math.random()*5)*pw;addP({k:'w',x:x+(Math.random()-0.5)*0.7,y:0.05,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:0.9+Math.random()*0.6,s:0.05+Math.random()*0.08,c:'#e8f8ff'});}
  addP({k:'r',x:x,y:0.02,vx:0,vy:0,life:0,max:1.2,s:0.3,c:'#ffffff'});}
function bubbles(x,y,n){for(let i=0;i<n;i++)addP({k:'b',x:x+(Math.random()-0.5)*0.6,y:y,vx:(Math.random()-0.5)*0.4,vy:0.6+Math.random()*1.2,life:0,max:0.8+Math.random()*0.8,s:0.03+Math.random()*0.05,c:'#dff6ff'});}
const CONF=['#ff4d6d','#ffd23f','#3ddc97','#4ea6ff','#c77dff','#ff9f1c'];
function confetti(x,y,n){for(let i=0;i<n;i++){const a=Math.PI/2+(Math.random()-0.5)*1.6,sp=4+Math.random()*6;addP({k:'c',x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0,max:1.6+Math.random()*0.8,s:0.08+Math.random()*0.06,c:CONF[i%CONF.length],r:Math.random()*6,vr:(Math.random()-0.5)*20});}}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;if(p.life>=p.max){parts.splice(i,1);continue;}
    if(p.k==='b'){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.y>0)p.life=p.max;continue;}
    if(p.k==='r'){p.s+=dt*2.2;continue;}
    const g=p.k==='c'?-4:(p.k==='d'?-1.5:G);p.vy+=g*dt;
    if(p.k==='c'){p.vx*=Math.exp(-dt*1.5);p.vy=Math.max(p.vy,-2.2);p.r+=p.vr*dt;}
    if(p.k==='d'){p.vx*=Math.exp(-dt*3);p.s+=dt*0.3;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    if(p.k==='w'&&p.y<0&&p.vy<0)p.life=p.max;}
}
const pops=[];
function popup(text,col,size,sub){pops.push({t:text,c:col||'#fff',s:size||1,sub:sub||'',life:0,max:1.8});if(pops.length>4)pops.shift();}

// ================= Ragdoll (Verlet) =================
let rag=null;
const RCON=[['head','chest',1],['chest','pelvis',1],['pelvis','kneeN',1],['kneeN','footN',1],['pelvis','kneeF',1],['kneeF','footF',1],
 ['chest','elbN',1],['elbN','handN',1],['chest','elbF',1],['elbF','handF',1],['head','pelvis',0.5],['kneeN','chest',0.04],['kneeF','chest',0.04],['footN','pelvis',0.03],['footF','pelvis',0.03],['kneeN','kneeF',0.02]];
const RRAD={head:0.12,chest:0.11,pelvis:0.11,kneeN:0.07,kneeF:0.07,footN:0.06,footF:0.06,elbN:0.05,elbF:0.05,handN:0.05,handF:0.05};
let thudCool=0;
function startRagdoll(kick){
  const pts={};const d=STEP;
  for(const k of RJ){const j=J[k];const rx=j.x-P.x, ry=j.y-P.y;let vx=P.vx-P.w*ry, vy=P.vy+P.w*rx;
    vx+=(Math.random()-0.5)*kick;vy+=Math.random()*kick*0.5;
    pts[k]={x:j.x,y:j.y,px:j.x-vx*d,py:j.y-vy*d};}
  const cons=RCON.map(c=>{const a=pts[c[0]],b=pts[c[1]];return [a,b,Math.hypot(a.x-b.x,a.y-b.y),c[2]];});
  rag={pts,cons,t:0};P.state='rag';P.stateT=0;J=newJ();syncRagJ();swapJ();
}
function syncRagJ(){for(const k of RJ){J[k].x=rag.pts[k].x;J[k].y=rag.pts[k].y;}}
function ragStep(dt){
  rag.t+=dt;const g=G*dt*dt;
  for(const k of RJ){const p=rag.pts[k];let vx=(p.x-p.px)*0.998, vy=(p.y-p.py)*0.998;
    if(p.y<0&&waterAt(p.x)){vx*=0.93;vy*=0.93;vy+=0.0009;}
    p.px=p.x;p.py=p.y;p.x+=vx;p.y+=vy+g;}
  for(let it=0;it<6;it++){
    for(const c of rag.cons){const a=c[0],b=c[1];let dx=b.x-a.x,dy=b.y-a.y;const dd=Math.hypot(dx,dy)||1e-6;const diff=(dd-c[2])/dd*0.5*c[3];dx*=diff;dy*=diff;a.x+=dx;a.y+=dy;b.x-=dx;b.y-=dy;}
    for(const k of RJ)collidePt(rag.pts[k],RRAD[k],it===5);
  }
}
function collidePt(p,r,fx){
  for(const it of level.items){
    if(it.type==='water')continue;const x1=itX1(it),x2=itX2(it);
    if(p.x<x1-r*0.3||p.x>x2+r*0.3)continue;
    const bottom=it.thin?it.top-it.thin:-50;
    if(p.y-r<it.top&&p.py-r>=it.top-0.2){bounce(p,it.top+r,it.type==='tramp'?0.78:0.25,it.type==='tramp'?0.92:0.7,fx,it);}
    else if(isSolid(it)&&p.y<it.top-0.05&&p.y>bottom){ // inside block side: push out
      if(p.x-x1<x2-p.x){p.x=x1-r*0.3-0.001;p.px=p.x+(p.x-p.px)*0.2;}else{p.x=x2+r*0.3+0.001;p.px=p.x+(p.x-p.px)*0.2;}}
    if(it.move&&Math.abs(p.y-r-it.top)<0.02&&p.x>=x1&&p.x<=x2){const dx=itOff(it)-itOff(it,gameT-STEP);p.x+=dx;p.px+=dx;}
  }
  if(!waterAt(p.x)&&p.y-r<0)bounce(p,r,0.25,0.7,fx,null);
}
function bounce(p,y,rest,fric,fx,it){
  const vy=p.y-p.py, vx=p.x-p.px;p.y=y;p.py=y+vy*rest;p.px=p.x-vx*fric;
  if(fx&&vy<-0.035&&thudCool<=0){thudCool=0.15;Snd.thud(clamp(-vy*12,0.3,1.2));
    dust(p.x,y-0.05,6,it&&it.type==='mat'?'#bfe1ff':(level.floor==='street'&&!it?'#9a9aa2':'#cdb89a'));
    if(it&&it.type==='tramp'){it.dip=0.35;it.dipX=p.x;Snd.boing();}}
}

// ================= Trajectory preview (power zones) =================
function simLanding(p,t0){
  const L=level.launch;let x=P.x,y=P.y,vx=lerp(L.vx[0],L.vx[1],p),vy=lerp(L.vy[0],L.vy[1],p),t=0;const dt=1/60;
  let py=y;
  for(let i=0;i<900;i++){t+=dt;vy+=G*dt;vx+=(level.wind||0)*dt;x+=vx*dt;y+=vy*dt;const f=y-1.0, pf=py-1.0;py=y;
    if(vy>0)continue;
    for(const it of level.items){if(it.start)continue;const x1=itX1(it,t0+t),x2=itX2(it,t0+t);
      if(x>=x1&&x<=x2&&pf>=it.top&&f<it.top){return goodHit(it,x,t0+t);}
      if(isSolid(it)&&x>x1&&x<x2&&f<it.top-0.2)return 0;}
    if(f<0){if(level.waterTarget&&x>=level.waterTarget[0]&&x<=level.waterTarget[1])return 2;return 0;}
  }
  return 0;
}
function goodHit(it,x,t){
  if(it.type==='tramp')return 1;
  const r=tRange(it,t);
  if(r)return (!r[2]&&x>=r[0]&&x<=r[1])?2:1;
  return it.type==='water'?1:0;
}
function inTarget(it,x){
  if(!it)return level.waterTarget?(x>=level.waterTarget[0]&&x<=level.waterTarget[1]):false;
  const r=tRange(it);return !!r&&!r[2]&&x>=r[0]&&x<=r[1];
}

// ================= Gameplay =================
const cam={x:0,y:0};let camSnap=true;
function launch(){
  const L=level.launch, p=P.meter;
  P.vx=lerp(L.vx[0],L.vx[1],p);P.vy=lerp(L.vy[0],L.vy[1],p);
  P.L=level.spin;P.state='air';P.airT=0;P.stateT=0;P.rot=0;P.lastFlip=0;P.ground=null;
  P.launchPose=copyPose(P.pose);
  Snd.jump();dust(P.x,startItem().top,8,'#d8cdb8');
}
function trickName(fl,water,half){
  const dir=fl<0||half<0?'Front':'Back';
  if(water){const h=Math.abs(half);
    if(h===0)return 'Pencil Jump';
    if(h===1)return dir+' Dive';
    if(h%2===1)return ((h-1)/2)+'.5 '+dir+'flip Dive';
    const n=h/2;return n===1?dir+'flip Entry':(['','','Double','Triple','Quad','Quint'][n]||n+'x')+' '+dir+'flip Entry';}
  const n=Math.abs(fl);
  if(n===0)return 'Stuck It';
  if(n===1)return dir+'flip';
  return (['','','Double','Triple','Quad','Quint','Sext'][n]||n+'x')+' '+dir+'flip';
}
function award(name,base,q,tgt){
  let m=(q==='perfect'?1.5:1)*(tgt?1.5:1)*(1+0.5*A.combo)*(1+0.1*Math.min(streak,10));
  if(q==='sketchy')m*=0.5;
  const pts=Math.max(5,Math.round(base*m/5)*5);
  A.score+=pts;A.log.push({name:name+(tgt?' · Target':''),pts,q});
  return pts;
}
function flipBase(n){return n===0?25:Math.round(n*100*(1+0.2*(n-1)));}

function landSolid(hit){
  const a=wrapA(P.th),aa=Math.abs(a);const it=hit.it;const feet=/foot|knee/.test(hit.k);
  P.lastLand={a:+a.toFixed(2),tuck:+P.tuck.toFixed(2),k:hit.k,rot:+P.rot.toFixed(2),air:+P.airT.toFixed(2)};
  let q;
  if(feet&&aa<0.66&&P.tuck<0.6)q=(aa<0.22&&P.tuck<0.35)?'perfect':'clean';
  else if(feet&&aa<1.05&&P.tuck<0.8)q='sketchy';
  else q='crash';
  const fl=Math.round(P.rot/TAU);
  const tgt=inTarget(it,P.x);
  const isTramp=it&&it.type==='tramp';
  if(q==='crash'){
    A.final='crash';A.finalName=pick(['FACEPLANT!','WIPEOUT!','OOF!','BONK!','RAGDOLLED!']);
    popup(A.finalName,'#ff5d5d',1.25,fl?Math.abs(fl)+' flip'+(Math.abs(fl)>1?'s':'')+' wasted':'');

  ctx.fillStyle=COL.hair;ctx.beginPath();ctx.arc(j.head.x,j.head.y,0.13,ha-0.3,ha+2.3);ctx.closePath();ctx.fill();
  ctx.strokeStyle=COL.band;ctx.lineWidth=0.035;ctx.beginPath();ctx.arc(j.head.x,j.head.y,0.115,ha-0.9,ha+0.2,false);ctx.stroke();
  ctx.fillStyle=COL.out;ctx.beginPath();ctx.arc(j.head.x+fx*0.07+ux/ul*0.02,j.head.y+fy*0.07+uy/ul*0.02,0.018,0,TAU);ctx.fill();
  // near side
  seg2(j.pelvis,j.kneeN,j.footN,0.17,COL.pants);shoe(j.kneeN,j.footN,COL.shoe);
  seg2(j.chest,j.elbN,j.handN,0.115,COL.shirt,COL.skin);hand(j.handN,COL.skin);
}
function drawTrail(){
  if(lowFx||trail.length<2||Math.abs(P.w)<3)return;
  ctx.lineCap='round';
  for(let i=0;i<trail.length;i++){const s=trail[i];const a=(i+1)/trail.length*0.16*clamp((Math.abs(P.w)-3)/6,0,1);
    ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=0.22;ctx.beginPath();
    // indexes: head0 chest1 pelvis2 kneeN3 footN4 kneeF5 footF6 elbN7 handN8 elbF9 handF10
    const p=k=>[s[k*2],s[k*2+1]];const pl=(ks)=>{let q=p(ks[0]);ctx.moveTo(q[0],q[1]);for(let n=1;n<ks.length;n++){q=p(ks[n]);ctx.lineTo(q[0],q[1]);}};
    pl([0,1,2,3,4]);pl([2,5,6]);pl([1,7,8]);pl([1,9,10]);ctx.stroke();}
}
function drawShadow(){
  const x=J.pelvis.x;let top=0;
  for(const it of level.items){if(it.type==='water')continue;if(x>=itX1(it)&&x<=itX2(it)&&it.top<=J.pelvis.y+0.2&&it.top>top)top=it.top;}
  if(top===0&&waterAt(x))return;
  const h=Math.max(0,Math.min(J.footN.y,J.footF.y,J.head.y)-top);const s=clamp(1-h/14,0.2,1);
  ctx.fillStyle='rgba(0,0,0,'+(0.32*s)+')';ctx.beginPath();ctx.ellipse(x,top+0.02,0.55*s+0.15,0.07*s,0,0,TAU);ctx.fill();
}
function drawParts(){
  for(const p of parts){const a=1-p.life/p.max;
    if(p.k==='c'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.min(1,a*2);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore();}
    else if(p.k==='r'){ctx.globalAlpha=a*0.7;ctx.strokeStyle=p.c;ctx.lineWidth=0.05;ctx.beginPath();ctx.ellipse(p.x,p.y,p.s,p.s*0.18,0,0,TAU);ctx.stroke();}
    else{ctx.globalAlpha=p.k==='d'?a*0.55:a;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}}
  ctx.globalAlpha=1;
}
let lightT=6;
function drawWeather(dt){
  if(!TH.rain&&!TH.snow)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const wind=(level.wind||0);const n=lowFx?40:110;
  if(TH.rain){
    ctx.strokeStyle='rgba(190,210,240,0.35)';ctx.lineWidth=1.2;ctx.beginPath();
    const sl=-6+wind*-8;
    for(let i=0;i<n;i++){const sp=900+hash(i)*500;const x=((hash(i+3)*W*1.3+gameT*(-sl*30)-cam.x*ppm*0.6)%(W+80)+W+80)%(W+80)-40;
      const y=((hash(i+7)*H+gameT*sp+cam.y*ppm*0.6)%(H+60)+H+60)%(H+60)-30;ctx.moveTo(x,y);ctx.lineTo(x+sl*2.2,y+22);}
    ctx.stroke();
    if(mode!=='paused'){lightT-=dt;if(lightT<=0){lightT=5+Math.random()*7;flash=1.6;Snd.noise(1.8,0.35,'lowpass',180,0.7,0.25,0.05);}}
  }else{
    ctx.fillStyle='rgba(255,255,255,0.85)';
    for(let i=0;i<n;i++){const sp=40+hash(i)*60;const x=((hash(i+3)*W+gameT*(wind*40+Math.sin(gameT+i)*12)-cam.x*ppm*0.5)%W+W)%W;
      const y=((hash(i+7)*H+gameT*sp+cam.y*ppm*0.5)%H+H)%H;const r=1+hash(i+1)*2.2;ctx.fillRect(x,y,r,r);}
  }
}
function drawWorld(){
  worldTf();
  const vw=W/ppm, vh=H/ppm;const L=cam.x-vw/2-2,R=cam.x+vw/2+2,B=cam.y-vh/2-2;
  drawFloor(L,R,Math.min(B,-3));
  for(const it of level.items){const x1=itX1(it)-3,x2=itX2(it)+3;if(x2<L||x1>R)continue;drawItem(it);}
  drawShadow();drawTrail();drawFigure(J);drawParts();
  drawWaterOverlay(L,R);
}

// ================= HUD =================
function txt(t,x,y,size,col,align,weight,stroke){
  ctx.font=(weight||800)+' '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,Arial,sans-serif';ctx.textAlign=align||'left';ctx.textBaseline='middle';
  if(stroke!==false){ctx.lineWidth=Math.max(3,size*0.16);ctx.strokeStyle='rgba(8,12,30,0.75)';ctx.lineJoin='round';ctx.strokeText(t,x,y);}
  ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y);
}
function drawHUD(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.drawImage(vigC,0,0,W,H);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.25)+')';ctx.fillRect(0,0,W,H);}
  if(mode==='title')return;
  const s=clamp(Math.min(W,H)/700,0.7,1.4);
  // panel
  ctx.fillStyle='rgba(8,14,36,0.5)';rrS(10,10,230*s,108*s,14*s);ctx.fill();
  txt((LI+1)+'. '+level.name,22*s,30*s,17*s,'#ffd23f');
  txt('SCORE',22*s,58*s,12*s,'rgba(255,255,255,0.7)',null,700);txt(String(A.score),22*s,80*s,26*s,'#fff');
  txt('BEST',120*s,58*s,12*s,'rgba(255,255,255,0.7)',null,700);txt(String(save.best[LI]||0),120*s,80*s,22*s,'#bfe3ff');
  txt('Goal '+level.goal+(streak>0?'   Streak '+streak+'  x'+(1+0.1*Math.min(streak,10)).toFixed(1):''),22*s,104*s,12*s,'rgba(255,255,255,0.75)',null,700,false);
  const extras=[];if(level.wind)extras.push('WIND '+(level.wind<0?'\u25C0 ':'\u25B6 ')+Math.abs(level.wind).toFixed(1));if(level.grav)extras.push('LOW GRAVITY');
  if(extras.length)txt(extras.join('   '),22*s,(118+14)*s,13*s,'#9fd8ff',null,800);
  // flip counter
  if(P.state==='air'){
    const r=Math.abs(P.rot)/TAU;const n=Math.floor(r);
    const big=46*s+Math.min(n,4)*6*s;const col=n>=3?'#ff7bd5':n>=2?'#ffd23f':n>=1?'#7dff9a':'#fff';
    txt(r.toFixed(1),W/2,H*0.13,big,col,'center',900);
    txt(P.rot<-0.3?'FRONTFLIPS':'FLIPS',W/2,H*0.13+big*0.62,14*s,'rgba(255,255,255,0.85)','center',800);
    // landing angle indicator
    const a=wrapA(P.th),ok=Math.abs(a)<0.66&&P.tuck<0.6;
    const cx=W/2+big*1.5,cy=H*0.13,rad=18*s;
    ctx.lineWidth=4*s;ctx.strokeStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(cx,cy,rad,0,TAU);ctx.stroke();
    ctx.strokeStyle='rgba(125,255,154,0.6)';ctx.beginPath();ctx.arc(cx,cy,rad,-Math.PI/2-0.66,-Math.PI/2+0.66);ctx.stroke();
    ctx.strokeStyle=ok?'#7dff9a':'#ff6b6b';ctx.lineWidth=5*s;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx-Math.sin(a)*rad*1.2,cy-Math.cos(a)*rad*1.2);ctx.stroke();
  }
  if(A.combo>0&&P.state==='air'){
    const cs=24*s*(1+0.05*Math.sin(gameT*10));txt('COMBO x'+(1+0.5*A.combo).toFixed(1),W/2,H*0.13+86*s,cs,'#ff9f1c','center',900);}
  // ready: power meter
  if(P.state==='ready'&&!resultShown){
    const bw=Math.min(W*0.7,420*s),bh=22*s,bx=W/2-bw/2,by=H-70*s;
    ctx.fillStyle='rgba(8,14,36,0.6)';rrS(bx-6,by-6,bw+12,bh+12,12*s);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.12)';ctx.fillRect(bx,by,bw,bh);
    for(let i=0;i<50;i++){const z=P.zones[i];if(!z)continue;ctx.fillStyle=z===2?'rgba(255,215,64,0.85)':'rgba(90,220,120,0.65)';ctx.fillRect(bx+bw*i/50,by,bw/50+0.5,bh);}
    const nx=bx+bw*P.meter;ctx.fillStyle='#fff';ctx.fillRect(nx-3*s,by-8*s,6*s,bh+16*s);
    txt('POWER',bx,by-18*s,13*s,'#fff',null,800);
    txt('green = on course   gold = target',bx+bw,by-18*s,12*s,'rgba(255,255,255,0.8)','right',700);
    const pulse=0.6+0.4*Math.sin(gameT*5);
    txt(touchSeen?'TAP to jump · HOLD to flip · RELEASE to land':'SPACE / click / tap to jump · HOLD to flip · RELEASE to land',W/2,by-50*s,Math.min(18*s,W/34),'rgba(255,255,255,'+pulse+')','center',800);
    txt(level.tip,W/2,by+bh+20*s,13*s,'rgba(255,255,255,0.85)','center',700);
  }
  // popups
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.life+=dt;if(p.life>p.max){pops.splice(i,1);continue;}
    const t=p.life/p.max, sc=p.life<0.15?0.6+p.life/0.15*0.5:1.1-Math.min(0.1,(p.life-0.15));
    ctx.globalAlpha=t>0.75?(1-t)/0.25:1;const y=H*0.36-i*0-t*30*s;
    txt(p.t,W/2,y,34*s*p.s*sc,p.c,'center',900);if(p.sub)txt(p.sub,W/2,y+32*s*p.s,18*s,'#fff','center',800);
    ctx.globalAlpha=1;}
}
function rrS(x,y,w,h,r){rr(x,y,w,h,r);}

// ================= UI / DOM =================
const $=id=>document.getElementById(id);
function hideEl(id){$(id).classList.add('hidden');}
function showEl(id){$(id).classList.remove('hidden');}
let selLevel=Math.min(save.last||0,save.unlocked-1);
function buildLevelGrid(){
  const g=$('levels');g.innerHTML='';let selEl=null;
  LEVELS.forEach((l,i)=>{
    if(i%6===0){const h=document.createElement('div');h.className='world';h.textContent='WORLD '+(l.world+1)+' \u00B7 '+WORLDS[l.world].toUpperCase();g.appendChild(h);}
    const b=document.createElement('button');const locked=i>=save.unlocked;const best=save.best[i]||0;
    b.className='lv'+(locked?' locked':'')+(i===selLevel?' sel':'')+(best>=l.goal?' done':'');
    const tags=(l.wind?' \u2022 wind':'')+(l.grav?' \u2022 low-G':'');
    b.innerHTML='<b>'+(locked?'&#128274; ':(best>=l.goal?'&#9733; ':''))+(i+1)+'. '+l.name+'</b><small>'+(locked?'Locked':'Best '+best+' / '+l.goal)+tags+'</small>';
    b.title=locked?'Score '+LEVELS[i-1].goal+' on level '+i+' to unlock':l.tip;
    b.addEventListener('click',()=>{Snd.init();Snd.click();if(locked)return;selLevel=i;buildLevelGrid();loadLevel(i);});
    b.addEventListener('dblclick',()=>{if(!locked)startGame(i);});
    g.appendChild(b);if(i===selLevel)selEl=b;});
  $('bPlay').textContent='PLAY  '+(selLevel+1)+'. '+LEVELS[selLevel].name.toUpperCase();
  $('unlockedCount').textContent=Math.min(save.unlocked,LEVELS.length)+' / '+LEVELS.length+' levels unlocked';
  if(selEl&&!$('title').classList.contains('hidden'))requestAnimationFrame(()=>{const c=g, r=selEl.offsetTop-c.offsetTop;if(r<c.scrollTop||r>c.scrollTop+c.clientHeight-selEl.offsetHeight)c.scrollTop=r-c.clientHeight/2+selEl.offsetHeight/2;});
}
function startGame(i){
  Snd.init();Snd.click();loadLevel(i);mode='play';hideEl('title');hideEl('pause');showEl('hud');readyAt=performance.now();
}
function toMenu(){mode='title';hideEl('result');hideEl('pause');hideEl('hud');selLevel=LI;showEl('title');buildLevelGrid();resetAttempt();Snd.wind(0,400);}
function pauseGame(){if(mode!=='play')return;mode='paused';showEl('pause');Snd.wind(0,400);input.back=input.front=false;}
function resumeGame(){if(mode!=='paused')return;mode='play';hideEl('pause');last=performance.now();readyAt=performance.now();}
function restart(){if(mode==='paused'){hideEl('pause');mode='play';}if(mode!=='play')return;resetAttempt();Snd.click();}
function showResult(clean,nb,unlocked){
  const t=$('rTitle');
  const titles={perfect:'PERFECT!',clean:'NAILED IT!',sketchy:'SKETCHY!',crash:A.finalName||'WIPEOUT!'};
  t.textContent=A.final==='perfect'||A.final==='clean'?(A.finalName==='RIP ENTRY!'?'RIP ENTRY!':titles[A.final]):(titles[A.final]||A.finalName);
  t.style.color=A.final==='perfect'?'#ffd23f':(A.final==='crash'?'#ff6b6b':(A.final==='sketchy'?'#ffb36b':'#7dff9a'));
  $('rSub').textContent=clean?(streak>1?'Clean streak: '+streak+' in a row':'Clean landing!'):pick(['The ground always wins.','Physics: 1, You: 0.','That looked like it hurt.','Open up earlier next time!']);
  const ul=$('rList');ul.innerHTML='';
  if(!A.log.length){const li=document.createElement('li');li.innerHTML='<span>No tricks landed</span><span>0</span>';ul.appendChild(li);}
  A.log.forEach(e=>{const li=document.createElement('li');const q=e.q==='perfect'?' ★':(e.q==='sketchy'?' (sketchy)':'');li.innerHTML='<span></span><span></span>';li.children[0].textContent=e.name+q;li.children[1].textContent='+'+e.pts;ul.appendChild(li);});
  $('rScore').textContent=A.score+' pts';
  $('rBest').textContent=(nb&&A.score>0?'NEW BEST! ':'Best: '+(save.best[LI]||0))+'  ·  Goal: '+level.goal;
  $('rUnlock').textContent=unlocked?'Unlocked: '+LEVELS[LI+1].name+'!':'';
  const nxt=$('bNext');nxt.classList.toggle('hidden',!(LI+1<LEVELS.length&&save.unlocked>LI+1));
  showEl('result');
}

// ================= Input =================
let touchSeen=false;
window.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')touchSeen=true;},true);
function canAct(){return mode==='play'&&performance.now()-readyAt>220;}
function press(dir){
  Snd.init();
  if(!canAct())return;
  if(resultShown)return;
  if(dir>0)input.back=true;else input.front=true;
  if(P.state==='ready')launch();
}
function release(dir){if(dir>0)input.back=false;else input.front=false;}
window.addEventListener('keydown',e=>{
  const k=e.code;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyS'].includes(k))e.preventDefault();
  if(e.repeat)return;
  if(k==='KeyM'){Snd.init();toggleMute();return;}
  if(mode==='title'&&(k==='Enter'||k==='Space')){startGame(selLevel);return;}
  if(k==='KeyP'||k==='Escape'){if(mode==='play')pauseGame();else if(mode==='paused')resumeGame();return;}
  if(mode==='paused'&&(k==='Space'||k==='Enter')){resumeGame();return;}
  if(k==='KeyR'){restart();return;}
  if(mode==='play'&&resultShown&&(k==='Space'||k==='Enter')){resetAttempt();return;}
  if(k==='Space'||k==='ArrowUp'||k==='KeyW')press(1);
  else if(k==='ArrowDown'||k==='KeyS')press(-1);
},{passive:false});
window.addEventListener('keyup',e=>{const k=e.code;if(k==='Space'||k==='ArrowUp'||k==='KeyW')release(1);else if(k==='ArrowDown'||k==='KeyS')release(-1);});
const activePtrs=new Set();
cvs.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='touch')touchSeen=true;activePtrs.add(e.pointerId);try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  if(mode==='play'&&resultShown){return;}press(1);},{passive:false});
function ptrUp(e){activePtrs.delete(e.pointerId);if(activePtrs.size===0)release(1);}
cvs.addEventListener('pointerup',ptrUp);cvs.addEventListener('pointercancel',ptrUp);cvs.addEventListener('lostpointercapture',ptrUp);
window.addEventListener('blur',()=>{input.back=input.front=false;activePtrs.clear();});
['touchmove','gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target===cvs||ev!=='touchmove')e.preventDefault();},{passive:false}));
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();Snd.wind(0,400);}});
function btn(id,fn){const b=$(id);b.addEventListener('pointerdown',e=>e.stopPropagation());b.addEventListener('click',e=>{e.stopPropagation();Snd.init();fn();b.blur();});}
function toggleMute(){Snd.setMuted(!Snd.muted);$('muteX').classList.toggle('hidden',!Snd.muted);$('muteWave').classList.toggle('hidden',Snd.muted);}
btn('bPlay',()=>startGame(selLevel));
btn('bPause',()=>{if(mode==='play')pauseGame();else resumeGame();});
btn('bRestart',()=>{if(mode==='play'||mode==='paused'){if(mode==='paused'){hideEl('pause');mode='play';}resetAttempt();}});
btn('bMute',toggleMute);
btn('bResume',resumeGame);
btn('bPRestart',restart);
btn('bPMenu',toMenu);
btn('bRetry',()=>{Snd.click();resetAttempt();});
btn('bNext',()=>{Snd.click();startGame(LI+1);});
btn('bMenu',toMenu);
$('muteX').classList.toggle('hidden',!Snd.muted);$('muteWave').classList.toggle('hidden',Snd.muted);

// ================= Main loop =================
let last=performance.now(),acc=0,perfAcc=0,perfN=0;
function frame(now){
  requestAnimationFrame(frame);
  if(document.hidden){last=now;return;}
  const raw=(now-last)/1000;last=now;const dt=Math.min(0.05,Math.max(0,raw));
  perfAcc+=raw;perfN++;
  if(perfN>=120){const avg=perfAcc/perfN;if(avg>0.026&&avg<0.5){if(dprCap>1){dprCap=1;resize();}else if(!lowFx){lowFx=true;PMAX=110;}}perfAcc=0;perfN=0;}
  if(mode==='play'){acc+=dt;let n=0;while(acc>=STEP&&n<8){update(STEP);acc-=STEP;n++;}if(n>=8)acc=0;}
  else if(mode==='title'){gameT+=dt;updateReady(dt);}
  if(mode!=='paused'){updateParts(dt);updateCamera(dt);shake=Math.max(0,shake-dt*1.6);flash=Math.max(0,flash-dt*2);}
  // wind sound
  if(mode==='play'&&P.state==='air'){const sp=Math.hypot(P.vx,P.vy);Snd.wind(clamp(Math.abs(P.w)*0.012+sp*0.006,0,0.24),300+Math.abs(P.w)*55+sp*15);}
  else Snd.wind(0,400);
  drawBackground();drawWorld();drawWeather(mode==='paused'?0:dt);drawHUD(mode==='paused'?0:dt);
}
// debug/test hook (read-only state + helpers for automated testing)
window.__skyflip={get mode(){return mode;},get state(){return P.state;},get score(){return A.score;},get final(){return A.final;},get rot(){return P.rot;},get log(){return A.log.slice();},
  start:i=>startGame(i||0),setMeter:v=>{P.meterT=Math.acos(1-2*clamp(v,0,1))*1.5/TAU;},get result(){return resultShown;},get lastLand(){return P.lastLand;},get meter(){return P.meter;},get zones(){return P.zones.slice();},get goal(){return level.goal;},levels:LEVELS.length,
  unlockAll:()=>{save.unlocked=LEVELS.length;persist();buildLevelGrid();},
  analyze:i=>{loadLevel(i);const out=[];for(let k=0;k<8;k++){let g=0,t2=0;for(let j=0;j<50;j++){const z=simLanding((j+0.5)/50,k*0.45);if(z)g++;if(z===2)t2++;}out.push(g+'/'+t2);}return out.join(' ');}};
window.addEventListener('resize',resize);
resize();loadLevel(selLevel);buildLevelGrid();
requestAnimationFrame(frame);
})();

</script>
